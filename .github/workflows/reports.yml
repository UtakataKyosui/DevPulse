name: Publish daily reports

on:
  schedule:
    # 21:15 JST publication, then hourly recovery; GitHub may delay scheduled runs.
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devpulse-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: 'false'
      DEVPULSE_SITE_URL: ${{ vars.DEVPULSE_SITE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 取得に失敗するとここでジョブが止まり、デプロイされない(fixture へは切り替えない)。
      - name: Fetch project config
        run: pnpm run projects:fetch
      - name: Fetch saved reports
        run: pnpm run reports:fetch
        env:
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
      - run: pnpm run test
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run worker:check
        env:
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      - name: Publish articles and RSS
        run: pnpm run worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      - name: Verify published feed and acknowledge
        run: |
          node scripts/verify-reports.ts
          pnpm run reports:ack
        env:
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
