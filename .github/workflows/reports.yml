name: Publish daily reports

on:
  schedule:
    # 21:15 JST publication, then hourly recovery; GitHub may delay scheduled runs.
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devpulse-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: 'false'
      DEVPULSE_SITE_URL: ${{ vars.DEVPULSE_SITE_URL }}
    steps:
      - uses: actions/checkout@v6
      # runner コンテキストは job レベルの env で使えないため、ここで設定する。
      - run: echo "CI_REPORT_DIR=${RUNNER_TEMP}/ci-report" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # デプロイ前に認証だけを確認し、401 の原因(未設定・失効・アカウント違い)を切り分ける。
      - name: Verify Cloudflare credentials
        run: bash scripts/ci/run-logged.sh verify-cloudflare bash scripts/ci/verify-cloudflare-auth.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 取得に失敗するとここでジョブが止まり、デプロイされない(fixture へは切り替えない)。
      - name: Fetch project config
        run: bash scripts/ci/run-logged.sh projects-fetch pnpm run projects:fetch
      - name: Fetch saved reports
        run: bash scripts/ci/run-logged.sh reports-fetch pnpm run reports:fetch
        env:
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
      - run: bash scripts/ci/run-logged.sh test pnpm run test
      - run: bash scripts/ci/run-logged.sh typecheck pnpm run typecheck
      - run: bash scripts/ci/run-logged.sh build pnpm run build
      - run: bash scripts/ci/run-logged.sh worker-check pnpm run worker:check
        env:
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      - name: Publish articles and RSS
        run: bash scripts/ci/run-logged.sh worker-deploy pnpm run worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      - name: Verify published feed and acknowledge
        run: |
          bash scripts/ci/run-logged.sh verify-reports node scripts/verify-reports.ts
          bash scripts/ci/run-logged.sh reports-ack pnpm run reports:ack
        env:
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
      # 失敗したステップとログの要点を report.md にまとめ、Step Summary と artifact に残す。
      - name: Build failure report
        if: failure()
        run: bash scripts/ci/build-failure-report.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_REPORT_DIR }}/report.md
          retention-days: 30
          if-no-files-found: warn
